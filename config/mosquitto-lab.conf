# Example /etc/mosquitto/conf.d/lab.conf (Mosquitto 2.0.18) as used for the paper's later runs.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd      # create with: mosquitto_passwd -c /etc/mosquitto/passwd <user>
set_tcp_nodelay true                     # removes ~40 ms Nagle holds on QoS 2 PUBREC/PUBCOMP
max_queued_messages 0                    # defaults (1000 / 20) silently drop QoS 1/2 backlogs after an outage
max_inflight_messages 0
